<template id="f-ch2-en">
  <div class="hg" data-sec="s2.1"><div class="kicker">2.1</div><h2>Find what does not change</h2></div>
  <p><span class="add">There is another reason I resist treating AI as a technology question:</span> once we talk technology, we spend every day chasing its trends. Whenever I talk about AI, I feel I have to find things that <span class="add">do not change</span>, some anchors. In business, some things do not change with time.</p>
  <p>So my point is that your agents and your AI transformation need a business foundation. I call it two foundational models. One keeps understanding the outside world and sensing your users: can you understand your users more efficiently than before? The other is about the inside: your coordination, your processes, your knowledge and what you have accumulated, explicit and tacit. Can all that be drawn out better?</p>
  <p>Let me quote something from seventy years ago. Peter Drucker said there is only one valid definition of business purpose: to create a customer.<sup class="n">1</sup> If we can create a new customer, find a need that has not been met, and build products, services and marketing stories that delight them, we cannot lose. Customers’ needs change too, so we always have to come back to the customer.</p>
  <div class="fullpage" data-tpl="t-drucker"></div>
  <p>I mean customers in the broad sense: business and consumer, individual and corporate. In the age of AI we have a chance to reshape how we understand customers.</p>

  <div class="hg" data-sec="s2.2"><div class="kicker">2.2</div><h2>LLMs model the subjective world</h2></div>
  <p>We have been working on one thing lately: using large language models to simulate how users make decisions, whether business buyers or consumers. Why can a language model simulate a user’s decisions? Think about how we communicate: through language. How do we think through a hard problem? By talking to ourselves in our heads. And the instinct of a large language model is to continue text, predicting over and over what the next character, the next token, should be. <span class="add">So once language is solved, we can go further and simulate thoughts, decisions and even behaviour.</span></p>
  <p>Here is an example. To simulate Harry Potter, we can feed all the Harry Potter books into a language model and build a Harry Potter simulator. Before language models, if you asked whether Harry prefers coffee or juice at breakfast, the method was retrieval, the logic of search. Not any more. Now it is deduction: if Harry is this kind of person, with this past, what will he do next?</p>
  <figure class="slide">
    <img src="img/deck/en/s24.jpg" width="1478" height="832" alt="LLMs model the subjective world">
    <figcaption><b>Fig. 2.1</b>Physics models the objective world; LLMs model the subjective world.</figcaption>
  </figure>
  <p>Have a guess: does Harry prefer juice or coffee? The simulation says juice, and pumpkin juice at that. <span class="add">The books never say directly what he likes to drink; the model inferred it from his life at Hogwarts.</span></p>
  <div class="stmt">Physics models the objective world; LLMs model the subjective world.</div>
  <p>That is modelling the subjective world: not looking up an answer but deducing what a person would choose. <span class="add">Starting from a user’s scattered past information, we can use AI to build a digital twin, a simulated copy of that person in the digital world. Because the model can simulate how this person talks and thinks, we can use it to understand the user and judge what they will do.</span></p>

  <div class="hg" data-sec="s2.3"><div class="kicker">2.3</div><h2>Using AI to understand people better</h2></div>
  <p><span class="add">Most of what we hear online today is about</span> AI replacing this job or that. But at the frontier of AI research, using AI to simulate and better understand people is an important direction. Here are three studies I like.</p>
  <figure class="slide">
    <img src="img/deck/en/s26.jpg" width="1478" height="832" alt="Research directions in modelling the subjective world">
    <figcaption><b>Fig. 2.2</b>Three research directions in modelling the subjective world: cognition, personality, behaviour.</figcaption>
  </figure>
  <p>The first is the Stanford “Smallville” project from three or four years ago. Researchers built a virtual town with 25 autonomous agents playing all kinds of roles and interacting with each other. It sounds like <i>The Sims</i>.<sup class="n">2</sup> The same team then did something more serious: they used the method to simulate 1,000 randomly chosen Americans.<sup class="n">3</sup> You can ask them about spending, politics, why young people don’t want children. <span class="add">A person’s digital twin answers the same questions about 85 per cent as accurately as the person matches their own answers two weeks later. Is that high? Remember that the same person, asked the same questions two weeks apart, does not answer exactly the same way either.</span> People are fickle. <span class="add">So the digital twin already captures the person quite accurately.</span></p>
  <p>The second is persona vectors, research by a team at Anthropic.<sup class="n">4</sup> The last step of training a model is alignment: aligning it with human values so that it is selfless, kind and very even-tempered. So that last step actually makes the model less like a person and more like a saint. Persona vectors ask: in a conversation, which words and sentences trigger the model and bring it back to a human state? Why did it suddenly get angry halfway through a chat, and which sentences caused it? In other words, what kind of sentence makes a model suddenly act like a normal person: a little selfish, petty, even dark.</p>
  <p>The third comes from economics. Economists study behaviour with economic games such as the prisoner’s dilemma, and these come with complete datasets. AI appears able to simulate a person, <span class="add">but its answers cluster around the single most probable one.</span> <span class="add">Say</span> everyone has 200 yuan in their pocket, and I come in, tell a very sad story and ask for support. Different people give me different amounts. Run a model a hundred times and nine times out of ten it gives about the same figure, around 80 yuan on average. People are not like that; people are random. So behavioural simulation works the other way round: it uses AI to recover human randomness.</p>

  <div class="hg" data-sec="s2.4"><div class="kicker">2.4</div><h2>The Subjective World Model</h2></div>
  <p><span class="add">Building on this research, we did the engineering</span> and trained a model we call the Subjective World Model. Its purpose is to simulate all kinds of users, business and consumer. Its data comes from four layers. The first is expression: how people express themselves on Xiaohongshu, on WeChat. The second is narrative: interviews that ask why they express themselves that way. The third is cognition, the economic-game methods I just described. The fourth is behaviour: did they buy, did they click, did they do what you wanted them to do?</p>
  <p>Why four layers? Because people are contradictory and complicated. My wife might say she is a rational consumer, but in a luxury store she may not be, and when it comes to the children’s education she is not either. What people say and what they do often differ, which is why we need all four.</p>
  <figure class="slide">
    <img src="img/deck/en/s27.jpg" width="1478" height="832" alt="We trained the Subjective World Model">
    <figcaption><b>Fig. 2.3</b>Four layers of data in the Subjective World Model: expression, story, cognition, behaviour. People say one thing and do another, so all four are read together.</figcaption>
  </figure>
  <p>The model is trained on data from a million real users, and the application built on it is called atypica. In its first year <span class="add">it too has passed a million users</span>, across 50 countries and regions<span class="add"> (Tezign data, as of 2026)</span>. You type in a question about your users, and it breaks the question into research questions, finds suitable AI personas, forms them into a panel and generates insights automatically. You can also mix AI personas with real interviewees: real people set the baseline, AI provides the scale.</p>

  <div class="hg" data-sec="s2.5"><div class="kicker">2.5</div><h2>Case: pre-testing a car</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s29.jpg" width="1478" height="832" alt="Subjective World Model makes user understanding always-on">
    <figcaption><b>Fig. 2.4</b>The Subjective World Model makes user understanding always on: anyone, any idea, anywhere, tested instantly.</figcaption>
  </figure>
  <p>What changes if AI can play virtual consumers, help us understand their needs better, and invite them to co-create and evaluate? Let me take an industry that may be more cut-throat than most: electric vehicles.</p>
  <p>A car used to take five to ten years to develop, one step after another. Now it takes five to ten months. So carmakers no longer have time for post-testing, doing something first and then checking whether it could be better. Everything has to be pre-tested, with heavy simulation up front.</p>
  <p>An EV maker we work with launched a new brand, run by two very young presidents who wanted to rethink the process. Their first step was to define the users they wanted to serve: young families with two or more children in first-, second- and third-tier cities. <span class="add">Carmakers claim to spend more than anyone on user research and on building CRM and CDP systems (customer relationship management and customer data platforms).</span> The irony is that all their user data is about the person driving. Think about it: with an SUV or an MPV, the driver is often not the decision-maker. The decision is usually made by the spouse and the children. <span class="add">However much data you have on drivers, it cannot stand in for the person who really decides.</span></p>
  <p>So they used AI to simulate how families of three, families of four, even two or three generations together, choose a car. From strategic planning onward, they did not reduce users to a pile of labels such as segment, age and occupation. They worked with real families, one by one. Those are AI personas.</p>
  <p>In product definition they had these AI personas debate: how should we differentiate? When two or three generations of a family discuss a car, who plays which role? What car would make them willing to pay 250,000 to 300,000 yuan? Development still followed a traditional carmaker’s process, but they could keep testing with the personas: if the seat is built like this, how will these people feel? Then marketing: if I spend this much on a campaign, is the message right? Don’t end up with lots of clicks and likes but the wrong message. What they kept saying was that before users walk into the dealership, they should already know this car costs 300,000, not 150,000.</p>
  <p>Then user operations. Salespeople never knew what to say. The car’s specifications read like a manual, and salespeople had to make up their own pitch, saying different things to different people. Now it works the other way round: the AI personas are used to rewrite the whole sales script, and these virtual consumers can spar with salespeople, challenge them and help them build their skills. Many companies also run networks of brand-managed social accounts<span class="add">, a set of social media accounts run by the company</span>. The content looks as if users posted it, but the company produces it centrally; we call this the central kitchen. This cast of AI characters are exactly the protagonists of that content.</p>
  <p><span class="add">This way, in about five months to a year, you can build an entirely new digital environment for testing with consumers.</span> When we used to say we had user data, we meant phone numbers, contact details and purchase history. Those are all outcomes; they cannot predict anything.</p>
  <p>As we see it, perhaps 95 per cent of user-related decisions, from what to post on social media today to how you define your customer and what product you make, are subjective calls. So beyond the big projects you already do well, small projects can be tested continually too. <span class="add">Understanding users stops being one project after another and becomes a lasting capability of the company.</span></p>

  <div class="hg" data-sec="s2.6"><div class="kicker">2.6</div><h2>From hierarchy to intelligence</h2></div>
  <p>Understanding users in a new way is not enough. We also need to use AI in the same way to understand ourselves.</p>
  <figure class="slide">
    <img src="img/deck/en/s31.jpg" width="1478" height="832" alt="From Hierarchy to Intelligence">
    <figcaption><b>Fig. 2.5</b>From hierarchy to intelligence. Source: Jack Dorsey &amp; Roelof Botha, 2026.</figcaption>
  </figure>
  <p>Early this year an essay went viral, at least among the entrepreneurs I know: “From Hierarchy to Intelligence”, <span class="add">co-written by Twitter co-founder Jack Dorsey and Roelof Botha of Sequoia Capital</span>.<sup class="n">5</sup> The authors argue that every company’s organization has been built around people as the coordinators in the middle. Headquarters’ views travel through middle managers to the front line, and the front line’s sense of the market travels back the same way. More and more companies want to be flat, but flatness needs tools and technology to support it.</p>
  <p>A company, they write, needs two things: a world model of its own operations, and customer signals rich enough to make that model useful. Modelling your own operations means that every part of the company has to be understandable by AI.</p>
  <p>Many companies’ spans of control are growing. There is a famous number online: Jensen Huang has more than sixty direct reports, and people at his company later told me it may now be over a hundred. He takes over a big meeting room every day, with all his direct reports in it. People can now manage far more than before, mainly because AI can supply the context instead of people passing it up and down. If people do the passing, the limit is Dunbar’s number<span class="add"> (the number of stable relationships one person can maintain)</span>: one person manages ten or so. That is the ceiling. <span class="add">But if AI understands the context, everyone gets company information through an agent. That role used to be played by your manager or colleagues; now it is an agent.</span> Then collaboration becomes a network rather than a hierarchy.</p>
  <figure class="slide">
    <img src="img/deck/en/s38.jpg" width="1478" height="832" alt="Enterprise agent">
    <figcaption><b>Fig. 2.6</b>Enterprise agents rest on two world models: the customer world model outside and the company world model inside.</figcaption>
  </figure>
  <p>Of course, companies that were already digital find this easier. Companies with both online and offline operations need <span class="add">some</span> time to make the shift. It depends.</p>

  <div class="hg" data-sec="s2.7"><div class="kicker">2.7</div><h2>Tacit knowledge</h2></div>
  <p>What makes up a company’s internal context? <span class="add">A philosopher is being quoted a lot again lately, because of a concept he introduced:</span> tacit knowledge. <span class="add">Once AI can handle huge amounts of explicit knowledge, people start paying attention again to the knowledge that cannot be put into words.</span> Michael Polanyi said: we know more than we can tell.<sup class="n">6</sup> There are two kinds of knowledge. One is explicit and can be written down, such as <span class="add">a standard operating procedure (SOP)</span>. The other is tacit: a judgment, a choice, an accumulation.</p>
  <p>In the digital age we turned nearly all explicit knowledge into data. In the age of AI we need to find ways, step by step, to connect tacit knowledge with digital content. Explicit knowledge is like an objective description of a customer: age, occupation, how many visits, how much they bought. Tacit knowledge is: I am a very good salesperson, and I suddenly realize this is a potential customer for a certain kind of sale. Or I look at a plot of land and sense what kind of place it could become. Those feelings are tacit knowledge. <span class="add">In the age of AI we really have a chance to connect the two, and let AI try to understand tacit knowledge.</span></p>
  <figure class="slide">
    <img src="img/deck/en/s33.jpg" width="1478" height="832" alt="Two kinds of internal knowledge">
    <figcaption><b>Fig. 2.7</b>Two kinds of internal knowledge. “We can know more than we can tell.”</figcaption>
  </figure>
  <p>Companies have always had two kinds of data. One is structured data, the kind a spreadsheet handles, with clear cause and effect. The other is images, text, video and sound, unstructured data. It used to be recorded but hardly understood; now we can try to understand it. To me the first is more like time’s enemy: once it is digitized, everyone knows it. The second is more like time’s friend: the more you accumulate, the more different you become. That brings us back to the prologue: AI should not be only about automation. It should also let what makes us different keep accumulating.</p>
  <figure class="slide">
    <img src="img/deck/en/s35.jpg" width="1478" height="832" alt="Schema">
    <figcaption><b>Fig. 2.8</b>Schema: structuring the context of work so that AI can use it.</figcaption>
  </figure>
  <p>Some companies care a lot about “we have our own data and nobody else does”. Here is an example. We worked with a global fast-food brand whose every order goes through its app or mini-program. In theory it has the most complete record of user behaviour. But when we used its existing data, which burger, when and where, to predict a customer’s taste for the next item, the prediction was actually worse than knowing their MBTI, whether they are an introvert or an extrovert<span class="add"> (MBTI is a popular personality typology; I-types lean introverted, E-types extroverted)</span>. Customers’ phone numbers are of course valuable. My point is that for a simple behavioural prediction, a company’s so-called proprietary data is not necessarily more accurate in business terms than knowing someone’s MBTI.</p>

  <div class="hg" data-sec="s2.8"><div class="kicker">2.8</div><h2>The most valuable context is yet to be written</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s34.jpg" width="1478" height="832" alt="The most valuable context is yet to be written">
    <figcaption><b>Fig. 2.9</b>The further down, the more valuable. The most valuable context has not been written down yet.</figcaption>
  </figure>
  <p>So the next step is to build context specifically for what AI can do. An example: we used to record meetings, but nobody had time to listen, so recordings were just records, not data. Now we record every meeting by default, because AI can read them. Recordings have gone from nearly worthless to an important input of knowledge.</p>
  <p><span class="add">More important still is to write down what has not been written down yet.</span> For example, a property developer’s skill in placemaking, the feel its people have for development: can it gradually become context the company can call on?</p>
  <p>But it is always true that the more we know, the more we know we don’t know. We now have tools that let us know more, but that does not make people less important; much remains unknown. The main change in this process is that accumulated knowledge is no longer written for people to read but for agents to read. So it can be as complex as it needs to be.</p>
  <p>Here is an interesting example. <span class="add">We recently did a project for a global lifestyle brand</span> that I call “the ontology of the dream of a better life”. <span class="add">The brand’s value is to give people a dream of a better life; “ontology” means organizing what we learn into a structure that agents can read.</span></p>
  <p>Over the years the brand had interviewed more than 3,000 typical consumers in depth, born in the 1960s, 70s, 80s, 90s and 2000s. Our job was to turn these customers into the company’s collective knowledge, its context: what a better life means to them, who they are, what they think, and how all this connects with the <span class="add">brand</span>’s ideas. We turned this into a foundation agents can read. <span class="add">So the agents no longer read an abstract process. They begin to understand how 3,000 people each understand the brand’s values.</span></p>
  <p>Next time, we can invite these agents to the discussion: how should we run the next campaign? How should the next store look? Which <span class="add">product</span> should we pick next? What should next season’s customer programme be? That is what I mean: the most valuable knowledge, the context agents read, is what has not been written down. It was never written before; now it can become the foundation AI reads.</p>

  <div class="hg" data-sec="s2.9"><div class="kicker">2.9</div><h2>Two foundations of AI</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s37.jpg" width="1478" height="832" alt="Two foundations of AI">
    <figcaption><b>Fig. 2.10</b>Beneath purpose sit AI’s two foundations: the customer world model outside and the company world model inside.</figcaption>
  </figure>
  <p>Chapter 1 was about purpose: transformation is the purpose, agents are the means. This chapter is about the foundation of AI, which is also the foundation of business. It has two dimensions, one outside and one inside: keep understanding your customers and users, and keep understanding your company.</p>
  <div class="stmt">An agentic transformation needs two world models: the customer world model outside, the company world model inside.</div>
  <p><span class="add">The next chapter covers the two modes of AI adoption that sit on top of these two models.</span></p>

  <div class="hg" data-sec="s3.1"><div class="kicker">3.1</div><h2>Humans use AI: smart for twenty seconds</h2></div>
  <p>With these two models, one outside and one inside, we can run many AI projects between them. We call them use cases: front office<span class="add"> (facing customers)</span>, middle office<span class="add"> (supporting the business)</span>, back office<span class="add"> (running internal operations)</span>, all kinds. These use cases fall into two modes. We all know the first well, but I think the second matters even more.</p>
  <figure class="slide">
    <img src="img/deck/en/s40.jpg" width="1478" height="832" alt="Mode A: humans use AI">
    <figcaption><b>Fig. 3.1</b>Mode A: humans use AI. AI as a copilot, centred on generating output.</figcaption>
  </figure>
  <p>The first mode, <span class="add">to put it plainly</span>, is humans using AI. Each of us has plenty of AI tools on our phones and computers, and we drive them to work for us. Every time I talk to an AI, it is smart for twenty seconds and makes me feel it has done a lot for me. People steer the answers, and the conclusions are fairly open.</p>
  <p>Everyone knows these tools, and they are so-called standard tools: buy them and use them out of the box, like the various copilots and office assistants. <span class="add">They are general-purpose, and anyone can pick them up.</span></p>

  <div class="hg" data-sec="s3.2"><div class="kicker">3.2</div><h2>AI uses humans: proactive agents, 24/7</h2></div>
  <p>The second mode I call AI using humans. The term is not ideal, but to make the point plainly: on one side humans use AI, on the other AI uses humans.</p>
  <figure class="slide">
    <img src="img/deck/en/s41.jpg" width="1478" height="832" alt="Mode B: AI uses humans">
    <figcaption><b>Fig. 3.2</b>Mode B: AI uses humans. AI as a proactive agent, centred on the workflow.</figcaption>
  </figure>
  <p>AI using humans means AI runs in your background around the clock. Sometimes it asks you for permission, sometimes for judgment, but it is smart 24/7, not smart for twenty seconds after you ask it something. We call it a proactive agent.</p>
  <p>It is a continuous agent that keeps working. It senses signals from outside, plans, does the work and evaluates the result on its own, and now and then it asks you a question.</p>

  <div class="hg" data-sec="s3.3"><div class="kicker">3.3</div><h2>Case: 1,000 to 2,000 new products a year</h2></div>
  <p>Take a scene you may know better. How many new products does a leading Chinese coffee chain launch in a year? Ten? A hundred? It develops about two to five a week. Of course, <span class="add">80 to 90 per cent of them never reach the market.</span> Growth in consumer businesses now comes from making more new products for known customers, because the single blockbuster no longer exists. So they have to keep making new products.</p>
  <figure class="slide">
    <img src="img/deck/en/s44.jpg" width="1478" height="832" alt="Proactive agent: long-horizon runtime">
    <figcaption><b>Fig. 3.3</b>The proactive agent’s loop: signal, plan, create, evaluate, running 24/7 in the background.</figcaption>
  </figure>
  <p>For a global food company we built an agent that develops new products around the clock. In the background it keeps looking for market signals: what are competitors doing? What new IP is emerging? What are these users newly interested in? What co-branding should we do? On the other side, it uses the user model described earlier to keep gathering the voice of the customer.</p>
  <p>It sends an email to the R&amp;D team. If the team does not reply within 24 hours, it moves to the next step on its own: <span class="add">it designs the packaging and works out the flavour.</span> If <span class="add">there is still no reply, it goes on to prepare the marketing campaign as well</span>: the <span class="add">in-store displays</span> offline and the plan online. Then it uses the consumer simulation to test whether the ideas are any good. Run this way, the whole process can produce about 1,000 to 2,000 new products a year.</p>
  <p>I asked the head of the team whether the AI’s products were any good. About 80 out of 100, he said. <span class="add">I said 80 isn’t good enough. He said that’s not the point:</span> people used to do everything from 0 to 80 themselves; now they can start at 80. So 100 is no longer the finish line; 120 or 150 is.</p>
  <figure class="slide">
    <img src="img/deck/en/s43.jpg" width="1478" height="832" alt="AI does the work from 0 to 80">
    <figcaption><b>Fig. 3.4</b>AI takes the work to 80; people start at 80. The bar is no longer 100.</figcaption>
  </figure>
  <p>This is really interesting. We used to have a lot of transactional work. To make a new product you would start with a meeting of dozens of people all talking at once, spend ages getting from 0 to 80, and never have time for 80 to 100. Now AI runs constantly in the background and makes 0 to 80 easier, so people can work on 80 to 100, or 80 to 120.</p>
  <p>The same is true in many industries, including my own field of research. Writing a paper used to mean that perhaps 70 or 80 per cent of the time <span class="add">went on formatting and checking references</span>. Now nobody needs to think about that, and all the time can go into research.</p>

  <div class="hg" data-sec="s3.4"><div class="kicker">3.4</div><h2>Connecting people with people</h2></div>
  <p>This shows us a new paradigm of human–machine collaboration: many proactive agents running in the background 24/7, even across departments and functions. It is not your assistant of today. The question it asks is: among these five people, these five roles, how much could AI connect? If each person only gets a little more efficient, collaboration between people stays inefficient. Can we connect it?</p>
  <p>So this is the agent we built: <span class="add">AI automatically picks up signals, plans, creates (that is, does the work) and evaluates</span>. On one side is the consumer context, on the other the company context, and it keeps innovating new products.</p>
  <p>But this did not happen overnight. At first we built two copilots, one for insight and one for packaging. Gradually we connected them into a workflow. Once you have a workflow, you are crossing departments: before, you were helping one function; now you are redesigning how work flows. After that, you close the whole loop and design how people and agents work together. The process took more than a year.</p>

  <div class="hg" data-sec="s3.5"><div class="kicker">3.5</div><h2>From marketing to leasing to buildings</h2></div>
  <p>We have used similar methods with many clients. <span class="add">One is a global consumer health company. Another is a global food and beverage group</span>, whose biggest initiative this year is E2E, end-to-end marketing and growth: every stage of marketing reshaped with AI. At each step: what the agents do, what the agency does, what people do, what the team does, what the systems do, and what context and intelligence lie underneath.</p>
  <p>We also do other interesting things. <span class="add">One client is a city development group. The district it runs competes fiercely with its neighbours</span>, so it has to keep finding the mix of businesses that suits it best. It now wants tech and consumer businesses, so it has to keep scouting: which industries and which brands are <span class="add">on the rise</span>? We help it keep gathering these potential brands and tenants, use AI to analyse automatically how they would fit with <span class="add">the district’s</span> mix, and monitor the industry as a whole. In effect, agents play the role of leasing staff, not one but several, scouting signals, finding fits and drafting proposals, while people make the calls.</p>
  <p>We are also working on a scene closer to property. Buildings are already well digitized and smart, <span class="add">but it all ends up on a dashboard, and someone still has to coordinate what it shows</span>. Now we have an agent watch that dashboard: how long cleaners stay in each building, how long security guards stay, whether they are really working; what separates the best cleaners and guards from the average, what could be optimized, and how to improve the work-order system.</p>
  <p>We are doing this for the property operations of a large state-owned bank. We are paid on savings, so there is one number I know for sure: this year the total property cost fell by 10 per cent. The reason is that AI watches the <span class="add">dashboard</span> in real time, around the clock. If people watch it, coordination takes time. We used to have no way of knowing whether a cleaner’s capacity was enough or fully used; now we can.</p>

  <div class="hg" data-sec="s3.6"><div class="kicker">3.6</div><h2>Two modes, each in its place</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s51.jpg" width="1478" height="832" alt="Two modes of AI adoption">
    <figcaption><b>Fig. 3.5</b>On top of the two world models, two modes of AI adoption: agents for humans, humans for agents.</figcaption>
  </figure>
  <p>So we gain another dimension: there are two ways to bring AI into work. One is agents that serve people, which everyone should use. The other is people serving agents: agents run in the background and greatly shorten <span class="add">the chains of cross-department work</span>.</p>
  <p>When the goal is unclear, humans use AI. When the optimization goal and the work goal are clear, build long-running, continuous, cross-department agents and let them run.</p>
  <div class="stmt">When the goal is unclear, humans use AI; when it is clear, let agents run long, continuous and across departments.</div>
</template>

<template id="f-ch4-en">
  <div class="hg" data-sec="s4.1"><div class="kicker">4.1</div><h2>Does the intelligence belong to the model, or to you?</h2></div>
  <p>There are two ways to talk about AI: the technical way and the <i>House of Cards</i> way<span class="add">, which is about power and manoeuvring</span>. This chapter is a bit like the latter. A term has been hot lately: sovereign AI. The reason is that <span class="add">as more and more intelligence is built on top of models</span>, does that intelligence belong to the model or to you?</p>
  <p>This is debated a lot in America, which has the best closed models. So a group of people oppose closed models and argue for open-weight ones. <span class="add">A closed model can only be called; an open-weight model can be downloaded, run and adapted on your own servers, so control stays with you.</span></p>
  <figure class="slide">
    <img src="img/deck/en/s60.jpg" width="1478" height="832" alt="Sovereign AI is about cognitive sovereignty">
    <figcaption><b>Fig. 4.1</b>Is the enterprise accumulating intelligence of its own? Sovereign AI is about an enterprise’s cognitive sovereignty.</figcaption>
  </figure>
  <p><span class="add">I think</span> that as we push AI today, we need to own our cognitive sovereignty. You should be able to say: this is the context I built, these are the agents I built, and whether I put them on model A, B or C, they can move.</p>
  <div class="stmt">Sovereign AI is about a company’s cognitive sovereignty.</div>

  <div class="hg" data-sec="s4.2"><div class="kicker">4.2</div><h2>More important than data security</h2></div>
  <p>This may matter even more than data security. Data security asked whether the data was yours. Now the question is: the intelligence that comes from your data, from your experience, from your tacit knowledge, is it yours?</p>
  <p>The model sits at the bottom, with all kinds of agents built on top. To make an agent useful, a company has to build a lot of its own intelligence on top of the model. This gets technical, so I will only list it. Post-training: can the model be trained to suit your company? Context: is the context the model draws on yours? The harness, the model’s boundaries, what it may and may not do: did you set it? Continual learning: the loop I described earlier, are its results yours?</p>
  <p>We will not build the models ourselves, but at least the layers above them should be <span class="add">something the company can take with it</span>.</p>

  <div class="hg" data-sec="s4.3"><div class="kicker">4.3</div><h2>Model agnostic</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s63.jpg" width="1478" height="832" alt="Own your intelligence: model agnostic">
    <figcaption><b>Fig. 4.2</b>Model agnostic: the model underneath can be swapped at any time; the intelligence above stays with the company.</figcaption>
  </figure>
  <p><span class="add">Today the model underneath can be Qwen, MiniMax or Zhipu</span>, or you can switch flexibly among three, four or five models. That matters a great deal. So companies now keep using a term: model agnostic. In the cloud era we talked about being cloud agnostic, able to switch to any cloud. In the model era we need to be model agnostic.</p>
  <p>This matters more than where the data is stored. As I said earlier, even with your own user data you may predict less accurately than MBTI, because AI has become so capable. The richest store of data in the world is inside the models. <span class="add">Your ability to harness models and turn them into your own intelligence, and whether what you learn truly belongs to you, matter more than the data itself.</span></p>

  <div class="hg" data-sec="s4.4"><div class="kicker">4.4</div><h2>We build for you, we build together, we teach you to build</h2></div>
  <figure class="slide">
    <img src="img/deck/crop/s65-en.jpg" width="1478" height="677" alt="Three phases to full ownership">
    <figcaption><b>Fig. 4.3</b>Ownership transfer by design: we build for you, we build together, you run it yourself.</figcaption>
  </figure>
  <p>How do you move AI capability over to the company? Take a global agribusiness and food group. We worked in three steps: first, we build it for you; second, we build it together; third, we teach you to build it. Step by step, the whole system and the capabilities on top of it moved over to the company. This matters, it takes a series of steps, and it takes time.</p>
  <p>Last year every company thought that <span class="add">installing an agent-building platform and a vibe-coding tool (one that lets you program by describing what you want in plain language)</span> meant doing AI. <span class="add">This year many found problems. One company gave each of its roughly 1,000 developers a coding AI last year; this year the results turned out to be a mess, and we went back in to help them sort it out.</span> So there is a threshold, but in the end external capability has to become your own.</p>

  <div class="hg" data-sec="s4.5"><div class="kicker">4.5</div><h2>Full ownership by design</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s66.jpg" width="1478" height="832" alt="Own your intelligence">
    <figcaption><b>Fig. 4.4</b>On top of every layer, one more: own your intelligence.</figcaption>
  </figure>
  <p>So on top of all the layers we add one more: own your own intelligence. Be model agnostic, with full ownership by design. From day one, an AI transformation project should be designed to hand control of AI back to the company: it can switch models at any time, is never held hostage by a model, and can move its models and AI capabilities out in full whenever it wants.</p>
  <div class="stmt"><span class="add">What you rent is capability. What you own is intelligence.</span></div>
</template>

<template id="f-ch5-en">
  <div class="hg" data-sec="s5.1"><div class="kicker">5.1</div><h2>1 : 2 : 7</h2></div>
  <p>Every year I run a not-very-serious poll of entrepreneurs on WeChat Moments: where does AI transformation get stuck?</p>
  <p>In 2023 people thought the biggest obstacle was AI infrastructure, which really meant data. In 2024 it was model capability. In 2025 the answers were about even. In 2026 the answer was 1 : 2 : 7<span class="add">: model 1, infrastructure (including data) 2, people and organization 7, with 70 per cent saying the obstacle is people and organization</span>. Technology is no longer the big obstacle: people look at their own technology and infrastructure and find them good enough, and their digitization is decent. The obstacle is people and organization.</p>
  <figure class="slide">
    <img src="img/deck/en/s67.jpg" width="1478" height="832" alt="1 : 2 : 7">
    <figcaption><b>Fig. 5.1</b>1 : 2 : 7. In 2023 the obstacle was data and infrastructure, in 2024 the models; in 2026, 70 per cent said it was people and organization.</figcaption>
  </figure>
  <p>I think people and organization are both the bottleneck and the opportunity to differentiate. <span class="add">It is the same point as the complementary investment in Chapter 1: what lies beyond the technology is the larger part.</span></p>

  <div class="hg" data-sec="s5.2"><div class="kicker">5.2</div><h2>Build a bridge, don’t teach people to swim</h2></div>
  <p>There are many ways to transform a company with AI. I want to borrow an idea from the architect Buckminster Fuller. <span class="add">He said that we rarely solve a problem head-on; we should instead find a new solution</span>, one so good that the old problem simply gets done the new way. <span class="add">Think of it like this</span>: to cross a river, I should not teach people to swim, <span class="add">because swimmers can always drown</span>. I should build a bridge, and make swimming look obsolete.</p>
  <figure class="slide">
    <img src="img/deck/en/s68.jpg" width="1478" height="832" alt="Inventing a new model">
    <figcaption><b>Fig. 5.2</b>Invent a new model: rather than fight the old one, build a new one that makes it obsolete.</figcaption>
  </figure>
  <p>I think transformation inside a company should work the same way. So lately we have run many labs. We did not walk into a company and tell everyone to switch to the new way. Recently, for example, we worked with a beauty company on a 30-person lab that uses AI-native methods to understand consumers, like the carmaker earlier, and to develop and market new products, to see whether it can produce a new product in six months. This group works the AI-native way and builds an example others can learn from.</p>
  <p>Say a company develops ten new products a year. Pick one and do it AI-native from start to finish; once it works, the other nine can learn from it. That beats rolling out AI layer by layer across marketing, then sales. When a few people get a small loop working, most people become willing to change. People who haven’t seen it only see problems; once they see it, they see possibilities.</p>
  <p>Our recent projects all work this way: build it first so the whole company sees the change, instead of forcing the whole company to change completely, which is very hard.</p>

  <div class="hg" data-sec="s5.3"><div class="kicker">5.3</div><h2>Return to the Renaissance man</h2></div>
  <p>Second, training matters. AI is often called another industrial revolution, but for talent I think it is an anti-industrial revolution. <span class="add">The logic of the industrial revolution is the division of labour:</span> across every industry, each person has a specialty and a role, in universities and even more in companies.</p>
  <figure class="slide">
    <img src="img/deck/en/s69.jpg" width="1478" height="832" alt="Return to Renaissance man">
    <figcaption><b>Fig. 5.3</b>Return to the Renaissance man: raise everyone’s floor, and be responsible for the outcome, not just the output.</figcaption>
  </figure>
  <p>Now AI can raise everyone’s floor. Each of us can do more, so each of us can take responsibility for outcomes, not just outputs. Output answers only to your own function; outcome answers to the company’s core goals. When everyone owns outcomes, the organization changes.</p>
  <p>So finding, training and regrouping talent becomes very important, rather than letting each role tend its own small plot a little more efficiently with AI. Organization matters, and so does finding and developing talent.</p>

  <div class="hg" data-sec="s5.4"><div class="kicker">5.4</div><h2>Hackathons for non-technical people</h2></div>
  <p>Lately I see many companies running non-tech hackathons. Hackathons used to be for geeks. Now many companies run them for people who are not technical: the people most eager to try AI take a need of their own, solve it with a little AI, and the company gives them some reward.</p>
  <p>Last year MIT published a <span class="add">headline-grabbing</span> report saying that 95 per cent of generative AI projects fell short of expectations on return.<sup class="n">1</sup> It won’t be that number this year. But <span class="add">another finding is more interesting: many employees were already using their own AI tools, which the researchers call shadow AI.</span> These people quietly use AI to solve problems, and so show the company exactly how to use it: how AI can really solve a finance problem, a legal problem, a design problem, rather than everything coming purely from the top.</p>

  <div class="hg" data-sec="s5.5"><div class="kicker">5.5</div><h2>Hand 0 to 80 to the agents</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s70.jpg" width="1478" height="832" alt="Agentic business organization">
    <figcaption><b>Fig. 5.4</b>The agentic business organization: agents take the work to 80, people take it from 80 to 120.</figcaption>
  </figure>
  <p>So we will see organizations change. One thing I strongly believe: hand work from 0 to 80 to agents as much as possible, and work above 80 to people.</p>
  <figure class="slide">
    <img src="img/deck/crop/s71-en.jpg" width="1478" height="832" alt="Three ways AI enters the firm">
    <figcaption><b>Fig. 5.5</b>Three ways AI enters the firm. All three will happen, in part.</figcaption>
  </figure>
  <p>AI enters an organization in three ways: beneath people, beside people and between people. Beneath: everyone keeps their seat, a layer of AI labour grows underneath, and each person moves up a step. At <span class="add">a food and beverage group</span>, for example, agents batch-generate channel content for every team. Beside: AI takes on a whole function, sits alongside human teams and reports to the same manager. At <span class="add">a city development group</span>, for example, the market-intelligence agent is a member of the team. Between: AI sits between management and teams, watching the work flow and pushing it forward, like the property-management agent that briefs, reminds and checks the team every day. All three will happen, in part.</p>
  <p>By now the full picture of AI is coming together: purpose at the top, then the two modes of using AI, the two foundations of AI, the technical choice of owning your intelligence, and finally people and process.</p>

<template id="f-ch6-en">
  <div class="hg" data-sec="s6.1"><div class="kicker">6.1</div><h2>We are not consultants. We are builders.</h2></div>
  <p>Our view has always been that agents are only the means; transformation is the purpose. Or put another way, transformation is the product.</p>
  <figure class="slide">
    <img src="img/deck/en/s74.jpg" width="1478" height="832" alt="We are not consultants. We are builders.">
    <figcaption><b>Fig. 6.1</b>We are not consultants. We are builders.</figcaption>
  </figure>
  <p>We are not really a consulting firm; we are a technology company. But I think that in AI transformation, builders like us need to take on consulting work. The reason is that no AI project today is purely technical. To a large extent it is about how a company changes. In other words, a company’s change through AI cannot rest on a slide deck or a theoretical framework.</p>

  <div class="hg" data-sec="s6.2"><div class="kicker">6.2</div><h2>AI is alive: you only know once it runs</h2></div>
  <p>First, you must have agents really running in production. AI is not like the software systems of old, which stayed the same once they went live. These AIs are almost alive: you have to use them, give feedback, tell them how to get better, even design data and processes specifically for them. So it is alive, and you only know once it runs.</p>
  <p>Second, as I said earlier, ownership transfer by design. What matters most is that the company has the capability itself, so we build together.</p>
  <p>Third, you need a good evaluation system. Without evaluation you don’t know what AI transformation means, or what AI should be doing.</p>
  <p><span class="add">Fourth,</span> go one use case at a time. As Fuller said, do it bit by bit, make it work, then expand.</p>
  <p><span class="add">Fifth,</span> every round builds up context. The better the context, the better the AI performs.</p>
  <div class="stmt"><span class="add">If the model changes, we are not worried. What we can truly control is the context.</span></div>
  <p>Finally, of course, it gradually becomes the company’s own capability.</p>

<template id="f-ch7-en">
  <div class="hg" data-sec="s7.1"><div class="kicker">7.1</div><h2>Start with a quantified goal</h2></div>
  <p>One thing really matters. In our discussions with many companies, we talk a lot about use cases, about problems, about opportunities, but not enough about goals. I keep asking: can we have a quantified goal? Without one, it is hard to know which way to go.</p>
  <p><span class="add">An AI budget does not buy a system; it buys capability. The goal is to change how work is done (not necessarily on day one), to build up knowledge, and to let capability compound.</span></p>
  <div class="stmt">An AI budget buys capability, not technology. Systems depreciate; capabilities compound.</div>
  <figure class="slide">
    <img src="img/deck/en/s80.jpg" width="1478" height="832" alt="An AI budget buys capability, not technology">
    <figcaption><b>Fig. 7.1</b>An AI budget buys capability, not technology. Systems depreciate; capabilities compound.</figcaption>
  </figure>

  <div class="hg" data-sec="s7.2"><div class="kicker">7.2</div><h2>How much do companies spend on AI?</h2></div>
  <p>Some basic numbers first. A survey of 1,330 companies found that average AI spending is about 3.3 per cent of revenue, which is quite a lot.<sup class="n">1</sup> Seen another way, AI takes more than 15 per cent of IT budgets, 36 per cent of digital budgets and 15.3 per cent of marketing budgets.<sup class="n">2</sup> In other words, AI money is spread across all kinds of business lines and budgets.</p>
  <figure class="slide">
    <img src="img/deck/en/s82.jpg" width="1478" height="832" alt="80% of AI spending sits outside IT">
    <figcaption><b>Fig. 7.2</b>80 per cent of AI spending sits outside the IT budget, and most of the value is created in the business units.</figcaption>
  </figure>
  <p>Of that 3.3 per cent, 0.5 points sit inside IT and 2.8 points outside it, in business lines and in functions such as HR and finance, where they produce business results directly. Value is distributed the same way: 68 per cent shows up in business results, 21 per cent in functions and 11 per cent in IT infrastructure.<sup class="n">1</sup></p>
  <p><span class="add">For AI to move from pilots to a standing budget line, it has to extend gradually from the IT budget into business budgets.</span> That is why AI transformation today is usually <span class="add">a project owned by the top boss</span>, by the whole leadership team, not just by the head of IT. As one saying goes, a company that treats AI only as IT has got its first step wrong. So more and more CFOs are taking charge of AI transformation or getting involved, because they see AI as an investment, not just a cost.</p>

  <div class="hg" data-sec="s7.3"><div class="kicker">7.3</div><h2>The 7 is where budgets fall short</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s83.jpg" width="1478" height="832" alt="The 7 is where budgets fall short">
    <figcaption><b>Fig. 7.3</b>The 7 is where budgets fall short.</figcaption>
  </figure>
  <p>What is most underfunded is precisely the 7 in 1 : 2 : 7. A few macro statistics: among companies that cut training budgets, 47 per cent raised AI spending at the same time, investing less in people while investing more in AI. Only 27 per cent of executives have a comprehensive AI talent strategy. Fewer than one company in ten is redesigning roles around AI.<sup class="n">3</sup></p>
  <p>Last year the share was even lower, but this year it has started to grow. We are seeing companies design roles specifically for AI: not a chief AI officer so much as roles that use AI for growth, roles that deploy AI, and so on. These new roles will appear.</p>
  <p>Between leaders and laggards, 55 per cent versus 17 per cent do strategic workforce planning for AI; between trailblazers and followers, 60 per cent versus 24 per cent of the AI budget goes to upskilling employees.<sup class="n">4</sup> So much of the investment should go into complementary investment, into the 7.</p>

  <div class="hg" data-sec="s7.4"><div class="kicker">7.4</div><h2>One budget, four pockets</h2></div>
  <p>There are roughly four pockets. The first is the technology foundation, which we have covered. The second is use-case agents. Agents must start from a use case. <span class="add">An agent is not one more system grown on top of some IT system, but AI that solves a specific business problem</span>, so it needs a clear business owner. The third is people and capability. The last is governance and change. All of these need the company’s managers to take part.</p>
  <figure class="slide">
    <img src="img/deck/en/s84.jpg" width="1478" height="832" alt="One budget, four pockets">
    <figcaption><b>Fig. 7.4</b>One budget, four pockets: technology foundation, use-case agents, people and capability, governance and change.</figcaption>
  </figure>
  <p>Where does the money go? <span class="add">AI spending is a broad notion, but it breaks down into a few parts.</span> Consulting and development are billed in person-days<span class="add">, that is, by the number of people and days put in</span>. Many foundational products are subscriptions you don’t need to build yourself, because they move fast, such as context systems and harness systems; building them in-house is very costly, and the technology changes too fast to maintain. The third part goes to people and change. Fourth, once people start using AI, especially proactive agents, token consumption rises, and that becomes a cost. Last come advisory and governance: always be clear about what kind of project you are doing.</p>
  <p><span class="add">In one sentence: whoever benefits pays; whoever will own the capability invests in it. IT funds the 1 and the 2; business units and HR together fund the 7.</span></p>

  <div class="hg" data-sec="s7.5"><div class="kicker">7.5</div><h2>One year is too short, three too long, two just right</h2></div>
  <figure class="slide">
    <img src="img/deck/en/s87.jpg" width="1478" height="832" alt="One year is too short, three too long. Two is right.">
    <figcaption><b>Fig. 7.5</b>One year is too short, three too long, two just right.</figcaption>
  </figure>
  <p>How should ROI be measured? This is my own feeling, and also what I hear from many entrepreneur friends and senior executives: one year is too short, three years too long, two years just right. If you <span class="add">expect to break even</span> in one year, the build-up time is probably too short. Three years, and you may not be able to wait, because AI changes so fast. So two years is right.</p>
  <p>When we work with clients, we plan by the quarter: one use case each quarter, for two years. The data says good companies may see results in 11 months, and laggards see them in 17.<sup class="n">1</sup> So as long as you do it, results come within a certain time.</p>
  <p>And the use cases multiply, and they iterate. Like the product-innovation agent I described: today you build a simple use case; tomorrow three simple ones can be chained into a complex one. All of this accumulates, as long as you do it.</p>

  <div class="hg" data-sec="s7.6"><div class="kicker">7.6</div><h2>Efficiency, growth, capability</h2></div>
  <p>Every company has this discussion: what is AI transformation actually worth to us? <span class="add">To put it plainly</span>, because my own company needs to grow too: what is growth? Growth is three things: efficiency, revenue, or <span class="add">building muscle</span>. <span class="add">In English</span>: efficiency, growth, capability.</p>
  <figure class="slide">
    <img src="img/deck/en/s90.jpg" width="1478" height="832" alt="Three kinds of return, three rulers">
    <figcaption><b>Fig. 7.6</b>Three kinds of return, three rulers: efficiency, growth, capability.</figcaption>
  </figure>
  <p>What is efficiency? Saving, or working faster: saving time, shortening cycles. What is growth? Finding new opportunities for business growth. What is capability? Whether we can invest in the future: in future talent, future products, future ways of managing.</p>
  <p>We must have a clear target value before we can choose where AI should go. Without a baseline and without ROI, transformation is hard. So there are three very high-level questions worth discussing: where does the money come from? How fast? What is the return?</p>
  <div class="stmt">No baseline, no ROI: measure before the pilot.</div>

  <div class="hg" data-sec="s7.7"><div class="kicker">7.7</div><h2>Case: four threes</h2></div>
  <p>To make this more concrete, take a global pharmaceutical company. Its goal <span class="add">sounds very Chinese</span>, but it was actually set by global headquarters: four threes. <span class="add">The first three is time:</span> within three years, triple the productivity of front-line staff; do the same middle-office work with a third of the people; and make high-quality decisions at the top three times faster. The last three is very hard to measure, but the first two are easy to see.</p>
  <p>To get there, they have five tracks over three years: marketing, sales, medical (in effect, marketing to doctors), R&amp;D and internal management. Each track covers three basics: re-orchestrating business processes, adjusting the underlying technology and data architecture, and designing and building the organization’s agents.</p>
  <figure class="slide">
    <img src="img/deck/en/s92.jpg" width="1478" height="832" alt="Case study: a global pharmaceutical company">
    <figcaption><b>Fig. 7.7</b>A global pharmaceutical company’s three-year goal: four threes.</figcaption>
  </figure>
  <p>Then they decided what to buy and what to build. Buy what? Models, without question; nobody trains their own. An enterprise agent architecture, and a context system. Build what? The agents themselves, and the content of the context. The systems are bought, but the agents and context on top are built in-house. That is the intelligence they can take with them.</p>
  <p>I am often asked which part of writing such a goal is hardest and most contested. As far as I know, two discussions take the most time.</p>
  <p>The first: <span class="add">should it be three times, or two, or four?</span> That is a big debate. They chose three for the same reason as one year too short, three too long, two just right: five is too aggressive, one is no challenge, so three. In the end it is an intuitive choice. But three sends a signal: not a small gain today, and not becoming a completely different company today either, but doing our utmost to get what is in front of us right.</p>
  <p>The second is execution: buy or build? Buying means whether to buy a mature solution; building means deciding what to build yourself. In the end they chose to build together with an AI company, along these tracks.</p>
  <p><span class="add">From “should we do it” to “what does success look like”: the more concrete this step, the easier the transformation is to start.</span></p>

<template id="f-ch8-en">
  <div class="hg" data-sec="s8.1"><div class="kicker">8.1</div><h2>Start with a diagnosis</h2></div>
  <p><span class="add">The first seven chapters covered why and what. This last chapter is about where to start: with an AI diagnosis.</span></p>
  <figure class="slide">
    <img src="img/deck/en/s95.jpg" width="1478" height="832" alt="AI diagnosis: see clearly, then transform">
    <figcaption><b>Fig. 8.1</b>AI diagnosis: see clearly, then transform.</figcaption>
  </figure>
  <p>In a diagnosis we first read the market from the outside, then run many interviews inside with the key roles, and analyse what we find with our frameworks to see where the transformation should start. After the diagnosis we define company-wide capability goals and priority use cases, which is the AI strategy; then we build the company’s own platform and agents, which is the AI tech stack, model agnostic and cloud agnostic.</p>
  <figure class="slide">
    <img src="img/deck/en/s94.jpg" width="1478" height="832" alt="How we work">
    <figcaption><b>Fig. 8.2</b>Two tracks after the diagnosis, technology and organization and people, converging in agentic transformation.</figcaption>
  </figure>
  <p>But again I have to stress complementary investment. Beside the technology track there is the organization and people track: first align the leadership team, because an organization can only go as far as its leaders; then train the teams, and find and activate the AI champions. Only where the two tracks meet is there an agentic transformation.</p>

  <div class="hg" data-sec="s8.2"><div class="kicker">8.2</div><h2>Six questions, four stages</h2></div>
  <p><span class="add">In a diagnosis we interview and map around six questions: what role does AI play in the company? How is value counted? How is the quality of output measured? How is data security handled? How will the organization and people change? Who drives it? On each question, a company sits roughly at one of four stages.</span></p>
  <h3>What role does AI play?</h3>
  <p>From a tool used now and then, to a colleague inside the workflow, to a way of changing the organization and the business. In leading companies, AI runs inside business processes and changes how work is allocated. <span class="add">McKinsey’s 2025 survey found that AI high performers are nearly three times as likely as other companies to have fundamentally redesigned their workflows.</span> Industries differ, of course: if you are in a fiercely competitive consumer market, you should think further ahead.</p>
  <h3>How is value counted?</h3>
  <p>This is something I care about a lot. Awareness anyone can top up by scrolling short videos; how value is counted is tied closely to each company. The first stage is “catch up first”: everyone is talking about AI, but there is no clear model for its future returns, so you start with one or two use cases. The second stage is “saves time, feels good”: AI shortens some piece of work and people feel the difference. The third stage is use cases with baselines and metrics, some kind of benchmark. The fourth is company-level goals that are aligned, with a shared pace.</p>
  <p><span class="add">Moving from the third stage to the fourth usually takes management to drive it:</span> there has to be a clear sense of direction. Whether it is four threes or something else, it cannot stay qualitative; it needs numbers. Leading companies set baselines and goals first, then choose use cases, and use company-level goals to get everyone aligned on pace.</p>
  <h3>How is output quality measured?</h3>
  <p><span class="add">The first stage</span> is to use AI only where it is accurate and not where it isn’t, which is perfectly normal. <span class="add">The second stage</span> relies on individuals to check: people who are good with AI simply use it better than others. I once talked with a senior partner at a consulting firm who felt he used AI far better than the young people under him, with the same tool. Individual skill determines AI performance. <span class="add">The third stage</span> is more advanced and relies on context and standards: can the company build a good environment for AI to run in? That environment really is an environment, like the neighbourhood we live in, except that now the residents are agents. <span class="add">The fourth stage</span> is a feedback loop of continuous evaluation.</p>
  <p>There are two approaches in AI today. In one, <span class="add">people hard-code the workflow and tell the agent</span> what to do in step one, two, three and four. In the other, you draw the boundaries and let AI work freely. More and more people lean towards the second, because AI keeps getting smarter. It is like children: if a child has no particular gift, you tell them one, two, three; if a child is gifted, you only tell them what not to do and let them get on with the rest. So context and standards become very important, and so do mechanisms for iteration and continuous evaluation.</p>
  <p>In leading companies, quality depends on the context and standards the company gives AI. That is a capability the company has to build, not something left to each person’s good habits. If everyone uses their own agent, the good conversations and lessons never settle into the company, and never become its capability.</p>
  <h3>How is data security handled?</h3>
  <p><span class="add">The first stage</span> is to forbid any input and simply not use it: if we don’t know whether it is safe, don’t use it. <span class="add">The second stage</span> is individuals using outside tools on their own: the company provides nothing, so people take company information to outside AI. You can assume your staff write with AI; I now assume my students write their papers with AI too, and if one gets a character wrong I almost treasure it. The worry is that you don’t know how many outside tools they use, and the information has already left. The third stage is building a controlled environment, and many companies’ IT teams put a lot of effort into this. The fourth stage is smarter. We recently worked with a technology company with very high security requirements. Its pain was that, because security was so tight, nothing could be used at all; it had effectively downgraded its own weapons. We are helping it build a system that grants access by level of risk. For user insight, for example, the data came from outside in the first place, so why can’t it go out? But for user testing of a core product, the product concept must not leave. So some things can live outside and some inside, with better tiering: convenience first for some, security first for others.</p>
  <p>Leading companies provide a controlled enterprise environment so that people dare to use AI and use it with confidence, instead of quietly using it outside.</p>
  <h3>How will the organization and people change?</h3>
  <p>Some people worry: will I be optimized out? Every company’s culture is different. Some create insecurity on purpose; others create security. My own company chose to create security, so we do a lot of training. Many say young people are more AI-native. I don’t think so. I teach at a university, and my students do not become AI-native on their own if nobody teaches them. So everyone has a chance to change. My father is over seventy and uses more tokens than I do. With the will, anyone can become more AI-native.</p>
  <p>The four stages here run from worrying about being optimized out, to training individual skills, to adjusting roles and processes accordingly, to linking AI with talent systems and career paths, so that AI is tied to a person’s career and to the organization. A company with a clear AI vision can also attract the best talent in its industry.</p>
  <h3>Who drives it?</h3>
  <p>The most passive way is to be dragged along, forced to act, waiting for orders from above. The second stage is departments raising needs and running pilots, bottom-up. The third stage is building capability into a system. The fourth is top and bottom moving together, each pulling the other along.</p>
  <p><span class="add">Throughout this book I have said that managers need a strong vision</span>, which is top-down. But AI also has an important bottom-up dimension. So I have always thought the best way is top and bottom moving together: neither one grand plan nor people quietly experimenting below, but the two combined organically. Many use cases are in fact discovered by people trying things, but they need to point in the direction the company wants to go.</p>

  <div class="hg" data-sec="s8.3"><div class="kicker">8.3</div><h2>Three kinds of problem, three kinds of answer</h2></div>
  <p>Top-down means crossing departments. Only cross-department matters need to come from the top, and only the bosses can solve them.</p>
  <p>Bottom-up means you have one very painful problem in one place: can you solve it yourself with AI, using whatever tool? At our company, for example, expense claims were sorted out by colleagues in finance themselves. We run a hackathon every month, with rewards and badges that count towards performance at year end. Another example: last year we wrote about 500 product R&amp;D documents, but the business side always felt R&amp;D did not give them enough “ammunition”. We used to need someone to turn R&amp;D documents into marketing material. Now AI does it, and the tool was built by colleagues on the business side. We strongly encourage this.</p>
  <p>Then there is AI that truly builds muscle, with no short-term ROI to measure, such as accumulating knowledge. Open questions like these need continuous exploration, and I suggest an AI Lab for them: it doesn’t need much investment, but it needs to keep trying, because new technical possibilities and new ideas can appear any day.</p>
  <div class="stmt"><span class="add">Cross-department problems, top-down; a single sore point, bottom-up; the future, to an AI Lab.</span></div>

  <div class="hg" data-sec="s8.4"><div class="kicker">8.4</div><h2>Diverge first, then converge</h2></div>
  <p>Even very mature companies go through a process of diverging first and converging later. They do not converge on day one; converge on day one and you will probably converge on the wrong thing. If you spend too long debating the roadmap while your own trial and error lags behind, the roadmap becomes armchair strategy.</p>
  <p>So both matter. Some quick wins are obviously worth doing; even if you can’t think them through, they are worth doing, so do them while you plan, and run both at once. That is also why we always say AI transformation is both technology and organization; and once it reaches organization and process, it is management’s job.</p>
  <div class="stmt">Not investing big before you have thought it through is right. Not investing at all is wrong.</div>
  <p>Where to start? My advice is to add first, then see where to subtract. <span class="add">Start with what is most distinctive about the company and what it cares about most, such as how it understands its users, and let AI amplify that first. Your existing teams will feel supported rather than replaced. Once the capability has grown, look at which processes can be cut.</span></p>
  <p><span class="add">Which brings us back to the line in the prologue: automation is the floor, differentiation the ceiling.</span></p>
</template>

      p.classList.remove('recto','verso'); p.classList.add(i%2?'verso':'recto');
      if(!p._ch)return;
      var rh=p.querySelector('.rh'); if(!rh){rh=document.createElement('div');rh.className='rh';p.appendChild(rh);}
      var fo=p.querySelector('.folio'); if(!fo){fo=document.createElement('div');fo.className='folio';p.appendChild(fo);}
      var en=lang()==='en', c=CH[p._ch];
      var chName=c?c[en?'en':'zh']:'';
      rh.textContent=i%2?(en?BOOK_EN:BOOK_ZH):chName;
      fo.textContent=String(i);
    });
    // contents page numbers
    list.forEach(function(p){[].forEach.call(p.querySelectorAll('[data-pg]'),function(s){var k=s.dataset.pg; if(pgMap[k]!=null)s.textContent=String(pgMap[k]);});});
  }

  function build(){
    var keepRatio=N?cur/N:0;
    pgMap={};
    book.innerHTML='';
    var list=paginate();
    if(list.length%2)list.push(blank());
    decorate(list);
    pages=list; leaves=[];
    for(var i=0;i<list.length;i+=2){
      var l=document.createElement('div'); l.className='leaf';
      l.appendChild(list[i]); if(list[i+1])l.appendChild(list[i+1]);
      book.appendChild(l); leaves.push(l);
    }
    N=leaves.length;
    list.forEach(function(p){var d=document.createElement('div');d.className='shade';p.appendChild(d);});
    ['r','l','tr v','br v','tl v','bl v'].forEach(function(c){var e=document.createElement('div');e.className='edge '+c;book.appendChild(e);});
    var sp=document.createElement('div');sp.className='spine';sp.innerHTML='<i>'+(lang()==='en'?'<span class="en">'+BOOK_EN+'</span><em>Ling Fan</em>':'<span>'+BOOK_ZH+'</span><em>范凌 著</em>')+'<b>TEZIGN</b></i>';book.appendChild(sp);
    var sl=document.getElementById('slider'); sl.max=N;
    document.getElementById('loading').hidden=true;
    go(Math.round(keepRatio*N));
  }

  function mmpx(){var t=document.createElement('div');t.style.width='170mm';document.body.appendChild(t);var w=t.getBoundingClientRect().width;t.remove();return w;}
  // 3D object: leaves stack in depth, edges show the page block, the closed book can be turned in the hand
  var rx=0, ry=0, tx0=0, ty0=0, drag=null, DZ=0;
  function depthOf(i){return i<cur?(cur-1-i):(i-cur);}
  function closed(){return cur===0||cur===N;}
  function layout(){
    var narrow=window.innerWidth<720;
    document.body.classList.toggle('list',narrow);
    if(narrow){root.style.setProperty('--z',Math.min(1,(document.body.clientWidth-32)/PW));return;}
    var r=stage.getBoundingClientRect();
    var s=Math.min((r.width-40)/(PW*2),(r.height-40)/PH)*(closed()?.86:1);
    var c=cur===0?PW/2:(cur===N?-PW/2:0);
    var T=N*DZ, zc=closed()?-T/2:0;
    book.style.transform='translate(-50%,-50%) scale('+s+') translate3d('+(-c)+'px,0,0) translate3d('+c+'px,0,'+zc+'px) rotateX('+(rx+ty0)+'deg) rotateY('+(ry+tx0)+'deg) translate3d('+(-c)+'px,0,'+(-zc)+'px)';
    var sh=document.getElementById('shadow'), w=(closed()?PW:PW*2)*s*1.05;
    sh.style.width=w+'px'; sh.style.height=(PH*s*.12)+'px';
    sh.style.transform='translate(-50%,'+(PH*s*.47)+'px)';
    stage.classList.toggle('grab',closed());
    document.getElementById('hint').style.opacity=closed()?1:0;
  }
  function placeLeaves(){
    leaves.forEach(function(l,i){
      var f=i<cur, z=-depthOf(i)*DZ;
      if(!l.classList.contains('drag'))l.style.transform='translateZ('+z+'px) rotateY('+(f?-180:0)+'deg)';
      l.style.zIndex=f?(i+1):(N-i);
      l.classList.toggle('far',closed()?(i!==0&&i!==N-1):(depthOf(i)>2&&i!==0&&i!==N-1));
      l.classList.toggle('top',depthOf(i)===0);
    });
    var R=(N-cur)*DZ, Lf=cur*DZ;
    book.querySelectorAll('.edge.r').forEach(function(e){e.style.width=R+'px';});
    book.querySelectorAll('.edge.tr,.edge.br').forEach(function(e){e.style.height=R+'px';});
    book.querySelectorAll('.edge.l').forEach(function(e){e.style.width=Lf+'px';});
    book.querySelectorAll('.edge.tl,.edge.bl').forEach(function(e){e.style.height=Lf+'px';});
    var sp=book.querySelector('.spine'); if(sp){sp.style.width=(N*DZ)+'px';sp.style.opacity=closed()?1:0;}
  }
  function go(k){
    var was=cur; cur=Math.max(0,Math.min(N,k));
    if(!closed()){rx=0;ry=0;}
    else if(was!==cur){rx=6;ry=cur===0?-18:18;}
    placeLeaves();
    document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===N;
    document.getElementById('slider').value=cur;
    var en=lang()==='en', L=cur*2-1, R=cur*2, total=pages.length-1;
    var txt=cur===0?(en?'Cover':'封面'):(cur===N?(en?'Back cover':'封底'):(en?'pp. ':'第 ')+L+'–'+R+(en?'':' 页'));
    document.getElementById('where').textContent=txt+' / '+total;
    document.getElementById('hint').textContent=en?'Drag to turn the book · click to open':'拖动可转动这本书 · 点击打开';
    layout();
  }
  function setLang(l){root.dataset.lang=l;root.lang=l==='en'?'en':'zh-CN';
    document.getElementById('bZh').setAttribute('aria-pressed',l==='zh');document.getElementById('bEn').setAttribute('aria-pressed',l==='en');
    document.getElementById('ver').textContent=l==='en'?'Draft · chapter 1 in English':'全书初稿';
    try{localStorage.setItem('book-lang',l);}catch(e){}
    if(PW)build();}
  function setMarks(on){root.classList.toggle('marks',on);document.getElementById('bMarks').setAttribute('aria-pressed',on);}

  document.getElementById('bZh').onclick=function(){setLang('zh');};
  document.getElementById('bEn').onclick=function(){setLang('en');};
  document.getElementById('bMarks').onclick=function(){setMarks(!root.classList.contains('marks'));};
  document.getElementById('prev').onclick=function(){go(cur-1);};
  document.getElementById('next').onclick=function(){go(cur+1);};
  document.getElementById('slider').oninput=function(e){go(+e.target.value);};
  document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);}else if(e.key==='l'||e.key==='L'){setLang(lang()==='en'?'zh':'en');}});
  function listMode(){return document.body.classList.contains('list');}
  stage.addEventListener('pointermove',function(e){
    if(listMode())return;
    if(!drag){ // gentle tilt toward the pointer, like holding the book
      var r=stage.getBoundingClientRect(), mx=(e.clientX-r.left)/r.width-.5, my=(e.clientY-r.top)/r.height-.5;
      var k=closed()?1:.35; tx0=mx*14*k; ty0=-my*10*k;
      book.style.transition='transform .5s cubic-bezier(.2,.7,.2,1)'; layout(); return;
    }
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
    if(drag.mode==='turn'){
      ry=drag.ry+dx*.45; rx=Math.max(-40,Math.min(40,drag.rx-dy*.3));
      book.style.transition='none'; layout();
    }else if(drag.leaf){
      var w=drag.pw, p=drag.dir>0?Math.max(0,Math.min(1,-dx/(w*1.6))):Math.max(0,Math.min(1,dx/(w*1.6)));
      drag.p=p; var ang=drag.dir>0?-180*p:-180*(1-p);
      drag.leaf.style.transform='translateZ(2px) rotateY('+ang+'deg)';
      var sh=Math.sin(p*Math.PI)*.9;
      [].forEach.call(drag.leaf.querySelectorAll('.shade'),function(x){x.style.transition='none';x.style.opacity=sh;});
    }
  });
  stage.addEventListener('pointerdown',function(e){
    if(listMode()||e.button>0)return;
    var r=book.getBoundingClientRect(), right=e.clientX>r.left+r.width/2;
    drag={x:e.clientX,y:e.clientY,moved:false,rx:rx,ry:ry,right:right,p:0,pw:r.width/2};
    if(closed()){drag.mode='turn';stage.classList.add('grabbing');}
    else{
      var i=right?cur:cur-1, dir=right?1:-1;
      if(i>=0&&i<N){drag.leaf=leaves[i];drag.dir=dir;drag.leaf.classList.add('drag');drag.leaf.style.zIndex=N+5;drag.leaf.classList.remove('far');}
    }
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
  });
  function endDrag(e){
    if(!drag)return; var d=drag; drag=null; stage.classList.remove('grabbing');
    if(d.mode==='turn'){
      book.style.transition='';
      if(!d.moved){ry=0;rx=0;layout();go(cur===0?1:N-1);}  // click opens the book
      return;
    }
    if(d.leaf){
      d.leaf.classList.remove('drag');
      [].forEach.call(d.leaf.querySelectorAll('.shade'),function(x){x.style.transition='';x.style.opacity=0;});
      if(!d.moved){go(d.dir>0?cur+1:cur-1);return;}
      go(d.p>.3?(d.dir>0?cur+1:cur-1):cur);
    }
  }
  stage.addEventListener('pointerup',endDrag);
  stage.addEventListener('pointercancel',endDrag);
  stage.addEventListener('pointerleave',function(){if(!drag){tx0=0;ty0=0;layout();}});
  window.addEventListener('resize',layout);

  var l0='zh';try{l0=localStorage.getItem('book-lang')||'zh';}catch(e){}
  setMarks(true); setLang(l0);
  PW=mmpx(); PH=PW*240/170; DZ=PW/170*0.32; rx=6; ry=-18;
  // warm up fonts with all flow text before measuring
  var warm=document.createElement('div');
  [].map.call(document.querySelectorAll('template[id^="f-"]'),function(t){return t.id;}).forEach(function(id){var p=newFlowPage('ch1');p.querySelector('.body').appendChild(document.getElementById(id).content.cloneNode(true));warm.appendChild(p);});
  document.getElementById('measure').appendChild(warm);
  var started=false;
  function start(){if(started)return;started=true;document.getElementById('measure').removeChild(warm);build();}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){setTimeout(start,50);});setTimeout(start,4000);}else start();
  var rb=null;if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',function(){if(!started)return;clearTimeout(rb);rb=setTimeout(build,300);});
})();
</script>

</body></html>
